<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>Campfire Wood</title>
<meta name="claude:viewport-fit-sides" content="cover">
<style>
/* Layout: one full-bleed stage; hiding spots on the edges, collection bubble at center, fire below it. Grayscale glossy forms only. */
:root{
  --bg:#d3d3d5;
  --glow:rgba(255,255,255,.95);
  --track:rgba(0,0,0,.2);
  --ink:#2b2b2e;
  --btn-hi:#ffffff;
  --btn-lo:#a6a6aa;
  --shadow:rgba(0,0,0,.28);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#131315;--glow:rgba(255,255,255,.7);--track:rgba(255,255,255,.2);--ink:#e7e7e9;
    --btn-hi:#606064;--btn-lo:#1c1c1f;--shadow:rgba(0,0,0,.65);color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#131315;--glow:rgba(255,255,255,.7);--track:rgba(255,255,255,.2);--ink:#e7e7e9;
  --btn-hi:#606064;--btn-lo:#1c1c1f;--shadow:rgba(0,0,0,.65);color-scheme:dark;
}
html,body{height:100%}
body{
  background:var(--bg);overflow:hidden;
  padding-left:max(16px,env(safe-area-inset-left,0px));
  padding-right:max(16px,env(safe-area-inset-right,0px));
  padding-block:0;box-sizing:border-box;
}
.stage{position:relative;width:100%;height:100%;overflow:hidden;user-select:none;-webkit-user-select:none;-webkit-tap-highlight-color:transparent}
.host{position:absolute}
.host>svg.art{position:absolute;inset:0;width:100%;height:100%;overflow:visible;z-index:1}

/* hiding spots */
.tree{bottom:10%;width:24vmin;aspect-ratio:200/340;transform:translateX(-50%);z-index:2}
#treeL{left:12%}
#treeR{left:88%}
.bench{bottom:9%;left:70%;width:28vmin;aspect-ratio:240/140;transform:translateX(-50%);z-index:2}

/* fire */
.fire{bottom:7%;left:50%;width:30vmin;aspect-ratio:260/150;transform:translateX(-50%);z-index:3}
.fire>svg.back{z-index:0}
.fire>svg.front{z-index:2;transform-origin:50% 100%}
.fire-logs{position:absolute;inset:0;z-index:1}
.pit-glow{position:absolute;left:10%;right:10%;top:34%;bottom:4%;border-radius:50%;
  background:radial-gradient(closest-side,var(--glow),transparent);opacity:0;z-index:1;pointer-events:none;transition:opacity .3s}
.fire.armed .pit-glow{opacity:.45}
.fire.hot .pit-glow{opacity:1}
.fire.lit .pit-glow{opacity:1;animation:flick .5s ease-in-out infinite alternate}

/* collection bubble */
.bag{left:50%;top:40%;width:32vmin;aspect-ratio:1;transform:translate(-50%,-50%);z-index:5}
.bag>svg.art{transform:scale(.6);opacity:.3;transition:transform .7s cubic-bezier(.34,1.56,.64,1),opacity .5s}
.bag>svg.back{z-index:0}
.bag>svg.front{z-index:2;pointer-events:none}
.bag.full>svg.art{transform:none;opacity:1}
.bag.popped>svg.art{transform:scale(1.4);opacity:0;transition:transform .35s ease-out,opacity .3s}
.bag-logs{position:absolute;inset:0;z-index:1}

/* wood */
.log{position:absolute;width:14vmin;aspect-ratio:3/1;transform:translate(-50%,-50%);z-index:0;outline:none;touch-action:none}
.log-rot,.log-fx{position:relative;width:100%;height:100%}
.log-fx{transition:transform .2s cubic-bezier(.34,1.56,.64,1)}
.log svg{position:absolute;inset:0;width:100%;height:100%;overflow:visible;filter:drop-shadow(0 .6vmin .6vmin var(--shadow))}
.halo{position:absolute;left:-28%;right:-28%;top:-95%;bottom:-95%;border-radius:50%;
  background:radial-gradient(closest-side,var(--glow),transparent);opacity:0;pointer-events:none;transition:opacity .3s}
.log.wild{cursor:pointer}
.log.wild .halo{opacity:1;animation:glow 1.5s ease-in-out infinite alternate}
.log.wild:hover .halo,.log.wild:focus-visible .halo{animation-duration:.45s}
.log.wild:hover .log-fx,.log.wild:focus-visible .log-fx{transform:scale(1.08)}
.log.floorA{left:26%;top:91%}
.log.floorB{left:63%;top:95%}
.log.bagged{width:10.5vmin;z-index:1;cursor:grab}
.log.bagged .halo{opacity:.55}
.log.bagged .log-fx{animation:bob 2.4s ease-in-out infinite alternate;animation-delay:var(--d,0s)}
.log.bagged:hover .log-fx,.log.bagged:focus-visible .log-fx{animation-duration:.6s}
.log.dragging{width:15vmin;z-index:30;cursor:grabbing}
.log.dragging .halo{opacity:.9}
.log.burning{width:12vmin;z-index:1}
.fire.lit .log.burning .halo{opacity:.9;animation:glow .6s ease-in-out infinite alternate}
.fire.lit .log.burning svg{filter:brightness(1.3) drop-shadow(0 0 1.2vmin var(--glow))}

.ember{position:absolute;z-index:3;pointer-events:none;aspect-ratio:1}
.ember svg{display:block;width:100%;height:100%}
.ring{position:absolute;border-radius:50%;border:2px solid var(--glow);pointer-events:none;z-index:35;box-sizing:border-box}

/* progress + reset */
.pips{position:absolute;top:26px;left:50%;transform:translateX(-50%);display:flex;gap:max(10px,1.6vmin);z-index:40}
.pip{position:relative;width:max(14px,2.4vmin);aspect-ratio:1;border-radius:50%;box-shadow:inset 0 0 0 1.5px var(--track)}
.pip.current{box-shadow:inset 0 0 0 2px var(--ink)}
.pip.next{animation:pipPulse 1.1s ease-in-out infinite alternate}
.pip-fill{position:absolute;inset:0;transform:scale(0);transition:transform .6s cubic-bezier(.34,1.56,.64,1)}
.pip-fill svg{display:block;width:100%;height:100%}
.reset{position:absolute;top:12px;right:0;width:44px;height:44px;border-radius:50%;border:0;padding:0;cursor:pointer;z-index:40;
  background:radial-gradient(circle at 35% 28%,var(--btn-hi),var(--btn-lo) 75%);
  box-shadow:0 3px 8px var(--shadow),inset 0 -2px 4px rgba(0,0,0,.22);display:grid;place-items:center}
.reset:focus-visible{outline:2px solid var(--ink);outline-offset:3px}
.reset svg{width:22px;height:22px;fill:none;stroke:var(--ink);stroke-width:2.2;stroke-linecap:round;stroke-linejoin:round}

@keyframes glow{from{opacity:.4;transform:scale(.9)}to{opacity:1;transform:scale(1.06)}}
@keyframes bob{from{transform:translateY(-.6vmin) rotate(-2deg)}to{transform:translateY(.6vmin) rotate(2deg)}}
@keyframes flick{from{opacity:.7;transform:scale(.94)}to{opacity:1;transform:scale(1.08)}}
@keyframes pipPulse{from{box-shadow:inset 0 0 0 1.5px var(--track),0 0 0 0 var(--glow)}to{box-shadow:inset 0 0 0 1.5px var(--track),0 0 0 .7vmin var(--glow)}}

/* tall screens */
@media (max-aspect-ratio: 4/5){
  .tree{bottom:42%;width:28vmin}
  #treeL{left:17%}
  #treeR{left:83%}
  .bench{left:50%;bottom:3%;width:38vmin}
  .fire{bottom:19%;width:36vmin}
  .bag{top:34%;width:36vmin}
  .log.floorA{left:22%;top:68%}
  .log.floorB{left:80%;top:72%}
}
@media (prefers-reduced-motion: reduce){
  .log.wild .halo,.log.bagged .log-fx,.fire.lit .pit-glow,.fire.lit .log.burning .halo,.pip.next{animation:none}
}
</style>

<script>
(() => {
  const RM = matchMedia('(prefers-reduced-motion: reduce)').matches;
  const T = ms => RM ? Math.min(ms, 120) : ms;
  const $ = s => document.querySelector(s);
  const stage = $('#stage'), bag = $('#bag'), bagLogs = $('#bagLogs'), fire = $('#fire'), fireLogs = $('#fireLogs');
  const pips = [...document.querySelectorAll('.pip')], pipsEl = $('#pips');

  const SPECS = [
    { host: 'treeL', x: 60, y: 82, r: 58 },
    { host: 'treeR', x: 18, y: 30, r: -25 },
    { host: 'bench', x: 35, y: 8,  r: -12 },
    { host: 'bench', x: 62, y: 80, r: 4 },
    { host: 'stage', cls: 'floorA', r: -9 },
    { host: 'stage', cls: 'floorB', r: 14 },
  ];
  const N = SPECS.length;
  const BAG = [[34,36,-14],[66,38,12],[30,54,9],[70,56,-8],[38,72,-4],[62,72,6]];
  const FIRE = [[40,60,-38],[60,60,38],[50,66,0],[45,52,-62],[55,52,62],[50,46,90]];

  const WOOD = '<svg viewBox="0 0 120 40" aria-hidden="true">' +
    '<rect x="2" y="4" width="116" height="32" rx="16" fill="url(#gCap)"/>' +
    '<rect x="14" y="8" width="78" height="7" rx="3.5" fill="url(#gSpec)"/>' +
    '<ellipse cx="103" cy="20" rx="11" ry="15" fill="url(#gEnd)"/>' +
    '<ellipse cx="103" cy="20" rx="5.5" ry="7.5" fill="none" stroke="#000" stroke-opacity=".18" stroke-width="1.5"/>' +
    '<circle cx="22" cy="11" r="2.4" fill="#fff"/></svg>';

  let state, drag = null;

  const hostEl = h => h === 'stage' ? stage : document.getElementById(h);
  const fx = el => el.querySelector('.log-fx');
  const setRot = (el, r) => { el.dataset.r = r; el.firstElementChild.style.transform = `rotate(${r}deg)`; };

  function makeLog(spec, i) {
    const el = document.createElement('div');
    el.className = 'log wild' + (spec.cls ? ' ' + spec.cls : '');
    el.tabIndex = 0;
    el.setAttribute('role', 'button');
    el.setAttribute('aria-label', 'Piece of wood');
    el.innerHTML = `<div class="log-rot"><div class="log-fx"><div class="halo"></div>${WOOD}</div></div>`;
    if (spec.host !== 'stage') { el.style.left = spec.x + '%'; el.style.top = spec.y + '%'; }
    setRot(el, spec.r);
    hostEl(spec.host).appendChild(el);
  }

  function init() {
    if (state && state.ember) clearInterval(state.ember);
    drag = null;
    document.querySelectorAll('.log,.ember,.ring').forEach(n => n.remove());
    state = { collected: 0, placed: 0, slots: Array(N).fill(null), ember: null };
    bag.classList.remove('full', 'popped');
    fire.classList.remove('lit', 'armed', 'hot');
    pips.forEach((p, i) => { p.classList.toggle('current', i === 0); p.classList.remove('next'); });
    pips.forEach(p => p.firstElementChild.style.transform = 'scale(0)');
    SPECS.forEach(makeLog);
    setProgress();
  }

  function setProgress() {
    const p = (state.collected + state.placed) / (2 * N);
    pips[0].firstElementChild.style.transform = `scale(${p})`;
    pipsEl.setAttribute('aria-valuenow', Math.round(p * 100));
  }

  function centerOf(el) {
    const a = el.getBoundingClientRect(), s = stage.getBoundingClientRect();
    return [a.left + a.width / 2 - s.left, a.top + a.height / 2 - s.top];
  }

  function ring(x, y, size, dur = 520) {
    const d = document.createElement('div');
    d.className = 'ring';
    d.style.width = d.style.height = size + 'px';
    d.style.left = (x - size / 2) + 'px';
    d.style.top = (y - size / 2) + 'px';
    stage.appendChild(d);
    d.animate([{ transform: 'scale(.2)', opacity: 1 }, { transform: 'scale(1)', opacity: 0 }],
      { duration: T(dur), easing: 'cubic-bezier(.2,.7,.3,1)' }).onfinish = () => d.remove();
  }

  function flipMove(el, parent, pos, o) {
    const a = el.getBoundingClientRect();
    const r0 = +el.dataset.r || 0;
    el.getAnimations().forEach(x => x.cancel());
    el.classList.remove('wild', 'bagged', 'dragging', 'burning', 'floorA', 'floorB');
    if (o.cls) el.classList.add(o.cls);
    parent.appendChild(el);
    el.style.left = pos.x + '%';
    el.style.top = pos.y + '%';
    setRot(el, pos.r);
    const b = el.getBoundingClientRect();
    const dx = a.left + a.width / 2 - (b.left + b.width / 2);
    const dy = a.top + a.height / 2 - (b.top + b.height / 2);
    const s = a.width / b.width;
    const base = 'translate(-50%,-50%)';
    const k = [{ transform: `${base} translate(${dx}px,${dy}px) scale(${s})` }];
    if (o.arc) {
      const lift = Math.min(Math.hypot(dx, dy) * .35, 140);
      k.push({ offset: .5, transform: `${base} translate(${dx * .5}px,${dy * .5 - lift}px) scale(${(s + 1) / 2 * 1.15})` });
    }
    k.push({ transform: base });
    const ease = o.ease || 'cubic-bezier(.25,.8,.25,1)';
    const an = el.animate(k, { duration: o.dur, easing: ease });
    el.firstElementChild.animate([{ transform: `rotate(${r0}deg)` }, { transform: `rotate(${pos.r}deg)` }], { duration: o.dur, easing: ease });
    return an.finished.catch(() => {});
  }

  function squish(el, d = 260) {
    return fx(el).animate([
      { transform: 'scale(1)' }, { transform: 'scale(1.25,.72)' },
      { transform: 'scale(.86,1.2)' }, { transform: 'scale(1)' }
    ], { duration: T(d), easing: 'ease-out' }).finished.catch(() => {});
  }

  function wiggle(el) {
    fx(el).animate([
      { transform: 'rotate(0)' }, { transform: 'rotate(-11deg)' }, { transform: 'rotate(9deg)' },
      { transform: 'rotate(-5deg)' }, { transform: 'rotate(0)' }
    ], { duration: T(420), easing: 'ease-out' });
  }

  function jiggle(target, d = 420) {
    target.animate([
      { transform: 'scale(1,1)' }, { transform: 'scale(1.07,.93)' },
      { transform: 'scale(.96,1.04)' }, { transform: 'scale(1,1)' }
    ], { duration: T(d), easing: 'ease-out' });
  }

  async function collect(el) {
    if (!el.classList.contains('wild')) return;
    el.classList.remove('wild');
    const slot = state.slots.indexOf(null);
    state.slots[slot] = el;
    el.dataset.slot = slot;
    state.collected++;
    const [cx, cy] = centerOf(el);
    ring(cx, cy, 90);
    bag.classList.add('full');
    await squish(el);
    const [x, y, r] = BAG[slot];
    el.setAttribute('aria-label', 'Collected wood');
    await flipMove(el, bagLogs, { x, y, r }, { cls: 'bagged', arc: true, dur: T(720), ease: 'cubic-bezier(.3,.75,.25,1.05)' });
    el.style.setProperty('--d', (-slot * .4) + 's');
    bag.querySelectorAll('.art').forEach(s => jiggle(s, 360));
    setProgress();
  }

  function overFire(x, y) {
    const f = fire.getBoundingClientRect();
    const cx = f.left + f.width * .5, cy = f.top + f.height * .62;
    return Math.hypot((x - cx) / (f.width * .46), (y - cy) / (f.height * .62)) < 1;
  }

  function spark(n = 4) {
    for (let i = 0; i < n; i++) ember(true);
  }

  function ember(quick) {
    const d = document.createElement('div');
    d.className = 'ember';
    const w = quick ? 1.4 + Math.random() * 1.6 : 2 + Math.random() * 4.5;
    d.style.width = w + 'vmin';
    d.style.left = (42 + Math.random() * 16) + '%';
    d.style.top = '58%';
    d.innerHTML = '<svg viewBox="0 0 100 100"><use href="#sphL"/></svg>';
    fire.appendChild(d);
    const rise = quick ? 6 + Math.random() * 6 : 14 + Math.random() * 16;
    const drift = (Math.random() - .5) * (quick ? 12 : 8);
    d.animate([
      { transform: 'translate(-50%,-50%) translate(0,0) scale(.2)', opacity: 0 },
      { offset: .2, opacity: 1, transform: `translate(-50%,-50%) translate(${drift * .3}vmin,-${rise * .25}vmin) scale(1)` },
      { transform: `translate(-50%,-50%) translate(${drift}vmin,-${rise}vmin) scale(.15)`, opacity: 0 }
    ], { duration: T(quick ? 650 : 1300 + Math.random() * 900), easing: 'cubic-bezier(.2,.6,.3,1)' }).onfinish = () => d.remove();
  }

  async function place(el) {
    const slot = +el.dataset.slot;
    state.slots[slot] = null;
    const i = state.placed++;
    const [x, y, r] = FIRE[i];
    el.tabIndex = -1;
    el.setAttribute('aria-label', 'Wood in the fire');
    await flipMove(el, fireLogs, { x, y, r }, { cls: 'burning', dur: T(460), ease: 'cubic-bezier(.34,1.4,.64,1)' });
    squish(el, 300);
    fire.querySelector('.front').animate([
      { transform: 'scale(1,1)' }, { transform: 'scale(1.05,.9)' }, { transform: 'scale(.98,1.04)' }, { transform: 'scale(1,1)' }
    ], { duration: T(380), easing: 'ease-out' });
    spark();
    setProgress();
    if (state.placed === N) complete();
  }

  function back(el) {
    const [x, y, r] = BAG[+el.dataset.slot];
    flipMove(el, bagLogs, { x, y, r }, { cls: 'bagged', dur: T(540), ease: 'cubic-bezier(.34,1.56,.64,1)' })
      .then(() => { wiggle(el); bag.querySelectorAll('.art').forEach(s => jiggle(s)); });
  }

  function complete() {
    setTimeout(() => {
      fire.classList.add('lit');
      bag.classList.add('popped');
      const [bx, by] = centerOf(bag);
      ring(bx, by, bag.offsetWidth * 1.3, 600);
      const [fx_, fy] = centerOf(fire);
      ring(fx_, fy, fire.offsetWidth * 1.8, 900);
      pips[0].animate([{ transform: 'scale(1)' }, { transform: 'scale(1.5)' }, { transform: 'scale(1)' }],
        { duration: T(500), easing: 'cubic-bezier(.34,1.56,.64,1)' });
      pips[1].classList.add('next');
      state.ember = setInterval(() => { if (!document.hidden) ember(false); }, RM ? 600 : 120);
    }, T(250));
  }

  // pointer handling
  stage.addEventListener('pointerdown', e => {
    const el = e.target.closest('.log');
    if (!el) return;
    if (el.classList.contains('wild')) { e.preventDefault(); collect(el); }
    else if (el.classList.contains('bagged')) {
      e.preventDefault();
      const a = el.getBoundingClientRect();
      drag = { el, id: e.pointerId, sx: e.clientX, sy: e.clientY,
               ox: a.left + a.width / 2 - e.clientX, oy: a.top + a.height / 2 - e.clientY, moved: false };
    }
  });

  window.addEventListener('pointermove', e => {
    if (!drag || e.pointerId !== drag.id) return;
    const el = drag.el, s = stage.getBoundingClientRect();
    if (!drag.moved) {
      if (Math.hypot(e.clientX - drag.sx, e.clientY - drag.sy) < 5) return;
      drag.moved = true;
      el.getAnimations().forEach(x => x.cancel());
      el.classList.remove('bagged');
      el.classList.add('dragging');
      stage.appendChild(el);
      fire.classList.add('armed');
      fx(el).animate([{ transform: 'scale(.75)' }, { transform: 'scale(1.12)' }, { transform: 'scale(1)' }],
        { duration: T(240), easing: 'ease-out' });
    }
    el.style.left = (e.clientX + drag.ox - s.left) + 'px';
    el.style.top = (e.clientY + drag.oy - s.top) + 'px';
    fire.classList.toggle('hot', overFire(e.clientX, e.clientY));
  });

  function endDrag(e) {
    if (!drag || e.pointerId !== drag.id) return;
    const d = drag; drag = null;
    fire.classList.remove('armed', 'hot');
    if (!d.moved) { wiggle(d.el); return; }
    if (e.type === 'pointerup' && overFire(e.clientX, e.clientY)) place(d.el);
    else back(d.el);
  }
  window.addEventListener('pointerup', endDrag);
  window.addEventListener('pointercancel', endDrag);

  stage.addEventListener('keydown', e => {
    if (e.key !== 'Enter' && e.key !== ' ') return;
    const el = e.target.closest('.log');
    if (!el) return;
    e.preventDefault();
    if (el.classList.contains('wild')) collect(el);
    else if (el.classList.contains('bagged')) place(el);
  });

  $('#reset').addEventListener('click', e => {
    e.currentTarget.querySelector('svg').animate([{ transform: 'rotate(0)' }, { transform: 'rotate(360deg)' }],
      { duration: T(500), easing: 'cubic-bezier(.34,1.3,.64,1)' });
    init();
  });

  init();
})();
</script>

</body></html>
